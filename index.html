<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De JS a Backend</title>
<meta name="description" content="Laboratorio gamificado en parejas: arrow functions, async/await, el DOM, sincronía y bases de datos (local y nube).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff6633;--accent-d:#e0480f;--navy:#000930;
  --bg:#eef1f6;--surface:#fff;--surface-2:#f4f6fb;--line:#dfe3ec;
  --fg:#1b2231;--muted:#6b7385;--ok:#128a5b;--ok-bg:#e4f6ee;--warn:#b4600a;--warn-bg:#fdf0dd;
  --code-bg:#0d1526;--code-fg:#e6ebf7;
  --display:"Fredoka",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080b13;--surface:#121826;--surface-2:#0d1320;--line:#242c3d;--fg:#e7ebf5;--muted:#98a1b6;
  --ok:#3ecf8e;--ok-bg:#10241c;--warn:#e0a44a;--warn-bg:#241b0f;--code-bg:#0a1120;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#080b13;--surface:#121826;--surface-2:#0d1320;--line:#242c3d;--fg:#e7ebf5;--muted:#98a1b6;
  --ok:#3ecf8e;--ok-bg:#10241c;--warn:#e0a44a;--warn-bg:#241b0f;--code-bg:#0a1120;color-scheme:dark;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
button{font-family:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:19px;color:var(--navy);display:flex;align-items:center;gap:9px}
:root[data-theme="dark"] .brand{color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:#fff}}
.brand .dot{width:14px;height:14px;border-radius:4px;background:var(--accent)}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top .sp{flex:1}
.stars{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--fg)}
.stars .bar{width:120px;height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.stars .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.tbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{border-color:var(--accent)}.tbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pair{display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--navy);color:#fff;flex-wrap:wrap;font-size:14px}
.pair .role{background:rgba(255,255,255,.1);padding:5px 10px;border-radius:20px;font-weight:600}
.pair input{border:0;border-radius:7px;padding:5px 9px;font-size:13px;width:110px;background:rgba(255,255,255,.12);color:#fff}
.pair input::placeholder{color:#b9c0d6}
.pair button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.pair .sp{flex:1}.pair .tip{font-size:12.5px;color:#b9c0d6}
.main{display:grid;grid-template-columns:234px 1fr;min-height:0;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px}
.lv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.lv:hover{background:var(--surface-2)}.lv.active{background:var(--accent);color:#fff;font-weight:600}
.lv .ic{font-size:17px;width:22px;text-align:center}.lv .st{margin-left:auto;font-size:12px;color:var(--muted)}
.lv.active .st{color:#fff}.lv.done .st{color:var(--ok);font-weight:700}.lv.active.done .st{color:#fff}
.play{overflow:auto;padding:22px;min-width:0;max-width:900px;margin:0 auto;width:100%}
h2.title{font-family:var(--display);font-weight:700;font-size:25px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:15px 17px;font-size:15px;margin:14px 0}
.intro p{margin:7px 0}.intro b{color:var(--accent-d)}
.intro code,.goal code,.ex code,.quiz code,p code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:.88em}
h3.step{font-family:var(--display);font-size:16px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* example (ya hecho) */
.ex{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;background:var(--surface)}
.ex .cap{padding:9px 14px;font-size:13.5px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ex .cap b{color:var(--accent-d)}
/* snippet (editor) */
.snip{background:var(--code-bg)}
.snip textarea{width:100%;border:0;outline:0;padding:12px 15px;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--code-bg);color:var(--code-fg);resize:vertical;tab-size:2;display:block}
.snipbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.runbtn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13.5px}
.runbtn:hover{background:var(--accent-d)}
.mini{background:transparent;color:#9aa3bd;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
.hintc{color:#9aa3bd;font-size:12px;margin-left:auto}
pre.out{margin:0;padding:11px 15px;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;background:#060a14;color:#cdd6ee;border-top:1px solid rgba(255,255,255,.08);min-height:16px;max-height:220px;overflow:auto}
pre.out.err{color:#ff9d9d}
pre.show{margin:10px 0;padding:13px 15px;border-radius:12px;background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow:auto;border:1px solid var(--line)}
/* mission */
.mission{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.mission.done{border-color:var(--ok)}
.goal{display:flex;gap:10px;align-items:flex-start;padding:14px 16px}
.goal .badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.mission.done .goal .badge{background:var(--ok)}
.goal .g{font-size:15px}.goal .g b{color:var(--accent-d)}
.goal .star{margin-left:auto;font-size:19px;filter:grayscale(1);opacity:.35}
.mission.done .goal .star{filter:none;opacity:1}
.fb{padding:10px 16px;font-size:14px;font-weight:600;border-top:1px solid var(--line)}
.fb.ok{color:var(--ok);background:var(--ok-bg)}.fb.no{color:var(--accent-d);background:var(--warn-bg)}
/* quiz */
.quiz{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin:14px 0;background:var(--surface)}
.quiz.done{border-color:var(--ok)}
.quiz .q{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;gap:10px}
.quiz .q .badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.quiz.done .q .badge{background:var(--ok)}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;font-size:14.5px}
.qopt:hover{border-color:var(--accent)}
.qopt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.qopt.bad{border-color:var(--accent-d);background:var(--warn-bg)}
.qexp{margin-top:8px;font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
/* interactive demos */
.demo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.demo .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.demo button{border:0;border-radius:9px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:14px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.demo button.p{background:var(--accent);color:#fff;border-color:var(--accent)}.demo button:hover{border-color:var(--accent)}
.demo .screen{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;min-height:44px;font-size:15px}
.demo .screen.ok{outline:2px solid var(--ok)}.demo .screen.bad{outline:2px solid var(--accent-d)}
.callout{border-radius:10px;padding:11px 15px;font-size:14.5px;margin:12px 0}
.callout.tip{background:var(--ok-bg);border:1px solid var(--line)}
.callout.warn{background:var(--warn-bg);border:1px solid var(--line)}
.callout .lbl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-d);display:block;margin-bottom:3px}
.swapline{background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;margin:16px 0;display:flex;gap:8px;align-items:center}
.swapline b{color:var(--accent)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:24px 0 10px}
.nav2 button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:15px}
.nav2 .prev{background:var(--surface);border:1px solid var(--line);color:var(--fg)}.nav2 .next{background:var(--accent);color:#fff}
.nav2 button:disabled{opacity:.4;cursor:not-allowed}
ul{margin:7px 0;padding-left:22px}li{margin:4px 0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:14px 0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ok);color:#fff;padding:11px 20px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:.3s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cft{position:fixed;top:-20px;font-size:20px;pointer-events:none;z-index:60;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}
@media (max-width:820px){.main{grid-template-columns:1fr;overflow:auto}.side{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side .lv{white-space:nowrap}.side .lv .txt{display:none}.side .lv .st{margin-left:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.cft{display:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot"></span>De JS a Backend <small id="brandsub"></small></div>
    <div class="sp"></div>
    <div class="stars">⭐ <span id="scount">0/0</span><span class="bar"><i id="sbar"></i></span></div>
    <button class="tbtn" id="es">ES</button><button class="tbtn" id="en">EN</button>
    <button class="tbtn" id="theme">◐</button>
  </div>
  <div class="pair">
    <span id="pairLead"></span>
    <span class="role">🧑‍✈️ <span id="pLabel"></span>: <input id="pilot" placeholder="nombre"></span>
    <span class="role">🧭 <span id="cLabel"></span>: <input id="copilot" placeholder="nombre"></span>
    <button id="swap">🔄 <span id="swapLabel"></span></button>
    <span class="sp"></span><span class="tip" id="pairTip"></span>
  </div>
  <div class="main"><nav class="side" id="side"></nav><section class="play" id="play"></section></div>
</div>
<div id="toast"></div>
<script>
"use strict";
const T={
 es:{sub:"Sistemas Web · USJ",pilot:"Piloto",copilot:"Copiloto",swap:"Cambiar roles",lead:"En parejas:",
   pairtip:"Un teclado. El piloto escribe, el copiloto guía. Cambiad en cada 🔄.",
   run:"▶ Probar",reset:"↺ Reiniciar",prev:"◀ Anterior",next:"Siguiente ▶",
   ok:"¡Correcto! ⭐",no:"Aún no. ",solved:"⭐ ¡Misión superada!",
   swapmsg:"Cambio de roles: ahora teclea el otro.",seeit:"Míralo funcionar",yourturn:"Te toca",
   mission:"Misión",quiz:"Pregunta",correct:"¡Bien! ",wrong:"Casi… prueba otra."},
 en:{sub:"Web Systems · USJ",pilot:"Driver",copilot:"Navigator",swap:"Swap roles",lead:"In pairs:",
   pairtip:"One keyboard. The driver types, the navigator guides. Swap on every 🔄.",
   run:"▶ Check",reset:"↺ Reset",prev:"◀ Back",next:"Next ▶",
   ok:"Correct! ⭐",no:"Not yet. ",solved:"⭐ Mission complete!",
   swapmsg:"Role swap: the other one types now.",seeit:"See it run",yourturn:"Your turn",
   mission:"Mission",quiz:"Question",correct:"Nice! ",wrong:"Almost… try another."}};
let lang=localStorage.getItem("jsbackLang")||"es";
const t=k=>T[lang][k], L=(es,en)=>lang==="es"?es:en;
const $=s=>document.querySelector(s);
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function fmt(x){if(typeof x==="string")return x;if(x===undefined)return"undefined";try{return JSON.stringify(x);}catch(e){return String(x);}}

// progress
let solved=new Set();try{solved=new Set(JSON.parse(localStorage.getItem("jsbackSolved")||"[]"));}catch(e){}
const saveSolved=()=>localStorage.setItem("jsbackSolved",JSON.stringify([...solved]));
function award(id){if(solved.has(id))return;solved.add(id);saveSolved();updateStars();confetti();toast(t("solved"));}
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1500);}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const em=["⭐","🎉","✨","🧡"];for(let i=0;i<14;i++){const s=h("span","cft",em[i%em.length]);s.style.left=(10+Math.random()*80)+"%";s.style.animationDelay=(Math.random()*.25)+"s";document.body.append(s);setTimeout(()=>s.remove(),1300);}}

// ---- JS runner ----
function run(code,helpersFn,onDone){
  const lines=[];let extra={};
  const log=(...a)=>lines.push(a.map(fmt).join(" "));
  const t0=performance.now();
  const logT=(...a)=>lines.push("["+Math.round(performance.now()-t0)+" ms] "+a.map(fmt).join(" "));
  console.log=log;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  try{extra=helpersFn?helpersFn():{};}catch(e){}
  const names=["log","logT","sleep",...Object.keys(extra)],vals=[log,logT,sleep,...Object.values(extra)];
  try{
    const fn=new Function(...names,'"use strict";return (async()=>{\n'+code+'\n})();');
    Promise.resolve(fn(...vals)).then(()=>onDone(lines,null,extra),e=>onDone(lines,e,extra));
  }catch(e){onDone(lines,e,extra);}
}
const maxMs=lines=>{let m=0;lines.forEach(l=>{const g=/\[(\d+) ms\]/.exec(l);if(g)m=Math.max(m,+g[1]);});return m;};
const joined=lines=>lines.join("\n");

// ---- components ----
function example(code,capEs,capEn,helpersFn){
  const box=h("div","ex");
  box.append(h("div","cap","<b>"+t("seeit")+".</b> "+L(capEs,capEn)));
  const sn=h("div","snip");const ta=h("textarea");ta.value=code.trim();ta.spellcheck=false;ta.rows=Math.min(16,code.trim().split("\n").length+1);
  tab(ta);const bar=h("div","snipbar");const rb=h("button","runbtn",t("run"));const out=h("pre","out");
  rb.onclick=()=>{out.textContent="…";out.classList.remove("err");run(ta.value,helpersFn,(ls,err)=>{out.textContent=joined(ls)||"(sin salida)";if(err){out.textContent+="\n⛔ "+err;out.classList.add("err");}});};
  bar.append(rb);sn.append(ta,bar,out);box.append(sn);setTimeout(()=>rb.onclick(),80);return box;
}
function mission(o){ // {id,n,goalEs,goalEn,code,helpersFn,check,hintEs,hintEn}
  const box=h("div","mission"+(solved.has(o.id)?" done":""));
  const goal=h("div","goal");
  goal.append(h("div","badge",o.n),h("div","g","<b>"+t("mission")+" "+o.n+".</b> "+L(o.goalEs,o.goalEn)),h("div","star","⭐"));
  box.append(goal);
  const sn=h("div","snip");const ta=h("textarea");ta.value=o.code.trim();ta.spellcheck=false;ta.rows=Math.min(16,o.code.trim().split("\n").length+1);
  tab(ta);const bar=h("div","snipbar");const rb=h("button","runbtn",t("run"));const rs=h("button","mini",t("reset"));const out=h("pre","out");
  const fb=h("div","fb");fb.hidden=true;
  rb.onclick=()=>{out.textContent="…";out.classList.remove("err");
    run(ta.value,o.helpersFn,(ls,err,ctx)=>{
      out.textContent=joined(ls)||"(sin salida)";if(err){out.textContent+="\n⛔ "+err;out.classList.add("err");}
      let res=false;try{res=o.check(ls,Object.assign({err},ctx));}catch(e){res=false;}
      fb.hidden=false;
      if(res){fb.className="fb ok";fb.textContent=t("ok");box.classList.add("done");award(o.id);}
      else{fb.className="fb no";fb.textContent=t("no")+L(o.hintEs,o.hintEn);}
    });};
  rs.onclick=()=>{ta.value=o.code.trim();out.textContent="";fb.hidden=true;};
  bar.append(rb,rs);sn.append(ta,bar,out);box.append(sn,fb);return box;
}
function quiz(o){ // {id,n,qEs,qEn,opts:[{es,en}],correct,expEs,expEn}
  const box=h("div","quiz"+(solved.has(o.id)?" done":""));
  const q=h("div","q");q.append(h("div","badge","?"),h("div",null,"<b>"+t("quiz")+" "+o.n+".</b> "+L(o.qEs,o.qEn)));
  box.append(q);const exp=h("div","qexp");exp.hidden=true;exp.innerHTML=L(o.expEs,o.expEn);
  o.opts.forEach((op,i)=>{const b=h("button","qopt",L(op.es,op.en));
    b.onclick=()=>{if(i===o.correct){b.className="qopt good";box.classList.add("done");exp.hidden=false;award(o.id);
        [...box.querySelectorAll(".qopt")].forEach(x=>x.disabled=true);}
      else{b.className="qopt bad";toast(t("wrong"));setTimeout(()=>b.className="qopt",700);}};
    box.append(b);});
  box.append(exp);return box;
}
function tab(ta){ta.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2;}});}
function intro(es,en){return h("div","intro",L(es,en));}
function step(es,en){return h("h3","step",L(es,en));}
function showCode(c){const p=h("pre","show");p.textContent=c.trim();return p;}
function swapline(){return h("div","swapline","🔄 <b>"+t("swap")+".</b> "+t("swapmsg"));}
function callout(kind,es,en){const c=h("div","callout "+kind);c.innerHTML='<span class="lbl">'+(kind==="warn"?L("Ojo","Watch out"):L("Idea clave","Key idea"))+"</span>"+L(es,en);return c;}

// ---------------- stations ----------------
const ST=[
 {id:"home",ic:"🚦",name:{es:"Inicio",en:"Start"},build:sHome,stars:[]},
 {id:"arrow",ic:"➡️",name:{es:"Arrow functions",en:"Arrow functions"},build:sArrow,stars:["arrow-1","arrow-2","arrow-3"]},
 {id:"async",ic:"⏳",name:{es:"async / await",en:"async / await"},build:sAsync,stars:["async-1","async-2","async-3"]},
 {id:"dom",ic:"🌳",name:{es:"El DOM",en:"The DOM"},build:sDom,stars:["dom-1","dom-2","dom-3"]},
 {id:"sync",ic:"⚡",name:{es:"Sincronía",en:"Sync bugs"},build:sSync,stars:["sync-1","sync-2"]},
 {id:"local",ic:"💾",name:{es:"BBDD local",en:"Local DB"},build:sLocal,stars:["local-1","local-2"]},
 {id:"cloud",ic:"☁️",name:{es:"BBDD nube",en:"Cloud DB"},build:sCloud,stars:["cloud-1","cloud-2"]},
];
const ALL=ST.flatMap(s=>s.stars);
let cur=0;

function sHome(p){
  p.append(h("h2","title",L("De JavaScript a Backend","From JavaScript to Backend")));
  p.append(h("p","sub",L("Un juego para clase, en parejas. Completa misiones y gana ⭐.","A class game, in pairs. Complete missions and earn ⭐.")));
  p.append(intro(
   `<p><b>Cómo se juega.</b> Cada tema tiene <b>misiones</b>: te decimos <b>qué hacer</b>, escribes un trozo de código y pulsas <b>${t("run")}</b>. Si está bien, ganas una ⭐.</p>

function sAsync(p){
  p.append(h("h2","title","async / await"));
  p.append(h("p","sub",L("Esperar algo lento sin congelar la página.","Wait for something slow without freezing the page.")));
  p.append(intro(
   `<p>Imagina pedir una <b>pizza</b> 🍕: no te quedas parado en la puerta. Sigues con otras cosas y te avisan cuando llega.</p>
    <p>En JS, pedir datos <b>tarda</b>. <code>await</code> dice "<b>espera</b> a que llegue esto, pero sin bloquear la página". Aquí tienes <code>sleep(ms)</code> para simular algo lento.</p>`,
   `<p>Picture ordering a <b>pizza</b> 🍕: you don't freeze at the door. You do other things and they call you when it arrives.</p>
    <p>In JS, fetching data is <b>slow</b>. <code>await</code> means "<b>wait</b> for this, without blocking the page". Here you have <code>sleep(ms)</code> to fake something slow.</p>`));
  p.append(example(`logT("pido la pizza");
await sleep(1000);         // espero 1 segundo
logT("pizza lista 🍕");`,"Mira los milisegundos: hay 1 segundo entre las dos líneas.","Watch the milliseconds: 1 second between the two lines."));
  p.append(step(t("yourturn"),t("yourturn")));
  p.append(mission({id:"async-1",n:"1",
   goalEs:'Haz que imprima <code>listo</code> <b>después</b> de esperar 1 segundo. Añade <code>await sleep(1000);</code> donde falta.',
   goalEn:'Print <code>listo</code> <b>after</b> waiting 1 second. Add <code>await sleep(1000);</code> where missing.',
   code:`logT("empiezo");
/* añade aquí la espera de 1 segundo */
logT("listo");`,
   check:ls=>joined(ls).includes("listo")&&maxMs(ls)>=850,
   hintEs:"Entre las dos líneas: <code>await sleep(1000);</code>",
   hintEn:"Between the two lines: <code>await sleep(1000);</code>"}));
  p.append(step(L("Secuencial vs a la vez","Sequential vs at once"),L("Secuencial vs a la vez","Sequential vs at once")));
  p.append(example(`logT("inicio");
await sleep(1000);  logT("tarea A");   // una…
await sleep(1000);  logT("tarea B");   // …y luego la otra
logT("FIN (~2 s)");`,"Dos esperas seguidas = ~2 segundos.","Two waits in a row = ~2 seconds."));
  p.append(mission({id:"async-2",n:"2",
   goalEs:"Si las dos tareas no dependen entre sí, lánzalas <b>a la vez</b> con <code>Promise.all</code> para tardar ~1 s (no 2). Completa el hueco.",
   goalEn:"If the two tasks don't depend on each other, fire them <b>at once</b> with <code>Promise.all</code> to take ~1 s (not 2). Fill the gap.",
   code:`logT("inicio");
await Promise.all([ /* sleep(1000), sleep(1000) */ ]);
logT("FIN");`,
   check:ls=>joined(ls).includes("FIN")&&maxMs(ls)>=850&&maxMs(ls)<1500,
   hintEs:"Dentro del array: <code>sleep(1000), sleep(1000)</code>",
   hintEn:"Inside the array: <code>sleep(1000), sleep(1000)</code>"}));
  p.append(swapline());
  p.append(step(L("El error nº 1: olvidar await","Bug #1: forgetting await"),L("El error nº 1: olvidar await","Bug #1: forgetting await")));
  p.append(mission({id:"async-3",n:"3",
   goalEs:"Esto imprime <code>undefined</code> porque falta un <code>await</code>. Añádelo para que imprima <b>Ada</b>.",
   goalEn:"This prints <code>undefined</code> because an <code>await</code> is missing. Add it so it prints <b>Ada</b>.",
   code:`const user = getUser();   // ← ¿qué falta aquí?
log( user.name );`,
   helpersFn:()=>({getUser:()=>new Promise(r=>setTimeout(()=>r({name:"Ada"}),400))}),
   check:ls=>joined(ls).includes("Ada"),
   hintEs:"Hay que <b>esperar</b> la promesa: <code>const user = await getUser();</code>",
   hintEn:"You must <b>await</b> the promise: <code>const user = await getUser();</code>"}));
  p.append(callout("warn",
   "Si ves <code>[object Promise]</code> o <code>undefined</code> al usar datos, casi seguro falta un <code>await</code>.",
   "If you see <code>[object Promise]</code> or <code>undefined</code> when using data, you're almost certainly missing an <code>await</code>."));
}

/* ponle color naranja */`,
   helpersFn:H,check:(ls,c)=>{const e=c.root&&c.root.querySelector("h4");return e&&getComputedStyle(e).color==="rgb(255, 102, 51)";},
   hintEs:'<code>titulo.style.color = "#ff6633";</code>',

  p.append(swapline());

   code:`const li = document.createElement("li");

function sSync(p){
  p.append(h("h2","title",L("Sincronía en el DOM","DOM sync problems")));
  p.append(h("p","sub",L("Cuando los datos llegan tarde o en desorden, la pantalla se lía.","When data arrives late or out of order, the screen gets confused.")));
  p.append(intro(
   `<p>La pantalla se pinta al instante, pero los datos llegan <b>cuando llegan</b>. Esa diferencia de tiempo causa los bugs más confusos. Vamos a verlos con botones (no hay que programar aquí: <b>pulsa, mira y contesta</b>).</p>`,
   `<p>The screen paints instantly, but data arrives <b>whenever it arrives</b>. That time gap causes the most confusing bugs. Let's see them with buttons (no coding here: <b>click, watch and answer</b>).</p>`));
  // Demo 1: race
  p.append(step(L("Bug 1 · Respuestas en desorden","Bug 1 · Out-of-order responses"),""));
  p.append(h("p",null,L("Un buscador. Pides <b>A</b> (tarda 1,8 s) y enseguida <b>B</b> (0,4 s). B contesta antes… pero la respuesta vieja de A llega después y <b>pisa</b> la de B.","A search box. You ask <b>A</b> (1.8 s) then quickly <b>B</b> (0.4 s). B answers first… but A's old answer arrives later and <b>overwrites</b> B's.")));
  const d1=h("div","demo");const sc=h("div","screen","—");let seq=0,fix=false;
  const search=(name,delay)=>{const my=++seq;sc.className="screen";sc.textContent=L("buscando… ","searching… ")+name;
    setTimeout(()=>{if(fix&&my!==seq)return;sc.textContent=L("Resultado: ","Result: ")+name;sc.className="screen "+(name[0]==="B"?"ok":"bad");},delay);};
  const sim=h("button","p",L("▶ Simular (A y luego B)","▶ Simulate (A then B)"));
  sim.onclick=()=>{search("A (lento)",1800);setTimeout(()=>search("B (rápido)",400),250);};
  const fc=h("label",null,'<input type="checkbox"> '+L("Activar el arreglo (ignorar respuestas viejas)","Enable the fix (ignore stale responses)"));
  fc.style.cssText="display:flex;gap:7px;align-items:center;font-size:14px";fc.querySelector("input").onchange=e=>fix=e.target.checked;
  const r1=h("div","row");r1.append(sim);const r2=h("div","row");r2.append(fc);d1.append(r1,r2,sc);p.append(d1);
  p.append(quiz({id:"sync-1",n:"1",
   qEs:'Pulsa <b>Simular</b> (sin marcar el arreglo). ¿Qué resultado final aparece?',
   qEn:'Press <b>Simulate</b> (fix unchecked). What final result appears?',
   opts:[{es:"A (lento) — en rojo ❌",en:"A (slow) — red ❌"},{es:"B (rápido) — en verde ✅",en:"B (fast) — green ✅"}],
   correct:0,
   expEs:"Exacto: la respuesta vieja de A llegó después y pisó la de B. <b>Arreglo:</b> cada petición lleva un número; al llegar, si ya no es la última, se descarta. Marca la casilla y vuelve a simular: ahora gana B. 🔄 Cambiad de piloto.",
   expEn:"Right: A's old answer arrived later and overwrote B's. <b>Fix:</b> each request carries a number; on arrival, if it's not the latest, it's dropped. Check the box and simulate again: now B wins. 🔄 Swap driver."}));
  p.append(showCode(`let ultima = 0;
function buscar(texto){
  const miId = ++ultima;
  pedir(texto).then(res => {
    if (miId !== ultima) return;   // ← llegó tarde: descartar
    pantalla.textContent = res;    // pinta solo la MÁS reciente
  });
}`));
  // Demo 2: before data
  p.append(step(L("Bug 2 · Pintar antes de tener el dato","Bug 2 · Painting before the data"),""));
  p.append(h("p",null,L("Lanzas la petición y pintas en la línea siguiente, sin esperar. El dato aún no está → <code>undefined</code>.","You fire the request and paint on the next line, without waiting. The data isn't there yet → <code>undefined</code>.")));
  const d2=h("div","demo");const sc2=h("div","screen","—");
  const getU=()=>new Promise(r=>setTimeout(()=>r({name:"Ada Lovelace"}),900));
  const bad=h("button",null,L("❌ Cargar (mal)","❌ Load (wrong)")),good=h("button","p",L("✅ Cargar (bien)","✅ Load (right)"));
  bad.onclick=()=>{let u;getU().then(x=>u=x);sc2.className="screen bad";sc2.textContent="Nombre: "+(u&&u.name);};
  good.onclick=async()=>{sc2.className="screen";sc2.textContent=L("Cargando…","Loading…");const u=await getU();sc2.className="screen ok";sc2.textContent="Nombre: "+u.name;};
  const r3=h("div","row");r3.append(bad,good);d2.append(r3,sc2);p.append(d2);
  p.append(quiz({id:"sync-2",n:"2",
   qEs:'¿Qué muestra el botón <b>"Cargar (mal)"</b>?',
   qEn:'What does the <b>"Load (wrong)"</b> button show?',
   opts:[{es:"El nombre correcto",en:"The correct name"},{es:"Nombre: undefined",en:"Name: undefined"},{es:"Un error rojo",en:"A red error"}],
   correct:1,
   expEs:'Pintó <b>antes</b> de que la promesa se cumpliera. El botón "bien" muestra <b>Cargando…</b> y luego el nombre. Diseña siempre tres estados: <b>cargando / dato / error</b>.',
   expEn:'It painted <b>before</b> the promise resolved. The "right" button shows <b>Loading…</b> then the name. Always design three states: <b>loading / data / error</b>.'}));
}

function sLocal(p){
  p.append(h("h2","title",L("Base de datos local · IndexedDB","Local database · IndexedDB")));
  p.append(h("p","sub",L("Guardar datos en el navegador — que no se pierdan al recargar.","Store data in the browser — so it survives a reload.")));

   `<p>El navegador trae su propia base de datos: <b>IndexedDB</b>. Vive en <b>este</b> equipo, no necesita servidor y <b>persiste</b> aunque cierres la pestaña.</p>
    <p>Abajo hay una mini-app de notas <b>real</b>. Añade una y <b>recarga la página</b>: seguirá ahí. 👇</p>`,
   `<p>The browser ships its own database: <b>IndexedDB</b>. It lives on <b>this</b> device, needs no server and <b>persists</b> even if you close the tab.</p>
    <p>Below is a <b>real</b> notes mini-app. Add one and <b>reload the page</b>: it'll still be there. 👇</p>`));
  const d=h("div","demo");const inp=h("input");inp.placeholder=L("escribe una nota…","type a note…");
  inp.style.cssText="flex:1;min-width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);font-size:14px";

  const list=h("ul");list.style.cssText="margin:10px 0 0;padding-left:20px";
  const row=h("div","row");row.append(inp,add,clr);d.append(row,list);p.append(d);
  let db;const open=()=>new Promise((res,rej)=>{const r=indexedDB.open("notasDB",1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore("notas",{keyPath:"id",autoIncrement:true});
    r.onsuccess=e=>res(e.target.result);r.onerror=rej;});
  const render=()=>{const st=db.transaction("notas").objectStore("notas").getAll();st.onsuccess=()=>{list.innerHTML="";
    if(!st.result.length){list.innerHTML="<li style='color:var(--muted);list-style:none'>"+L("(sin notas — añade una)","(no notes — add one)")+"</li>";return;}
    st.result.forEach(n=>list.append(h("li",null,n.texto)));};};
  add.onclick=()=>{const v=inp.value.trim();if(!v||!db)return;const tx=db.transaction("notas","readwrite");tx.objectStore("notas").add({texto:v});tx.oncomplete=render;inp.value="";inp.focus();};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")add.onclick();});
  clr.onclick=()=>{if(!db)return;const tx=db.transaction("notas","readwrite");tx.objectStore("notas").clear();tx.oncomplete=render;};
  open().then(x=>{db=x;render();}).catch(()=>list.innerHTML="<li>IndexedDB no disponible.</li>");
  p.append(showCode(`const req = indexedDB.open("notasDB", 1);
req.onupgradeneeded = e => e.target.result
   .createObjectStore("notas", { keyPath:"id", autoIncrement:true });
// guardar:
db.transaction("notas","readwrite").objectStore("notas").add({ texto:"hola" });`));
  p.append(step(t("yourturn"),t("yourturn")));
  p.append(quiz({id:"local-1",n:"1",
   qEs:"Añade una nota y <b>recarga la página</b>. ¿Sigue ahí?",
   qEn:"Add a note and <b>reload the page</b>. Is it still there?",
   opts:[{es:"Sí, sigue ahí ✅",en:"Yes, still there ✅"},{es:"No, se borró",en:"No, it's gone"}],
   correct:0,
   expEs:"¡Eso es IndexedDB! Los datos <b>persisten</b> en este navegador aunque recargues o cierres la pestaña.",
   expEn:"That's IndexedDB! Data <b>persists</b> in this browser even if you reload or close the tab."}));
  p.append(quiz({id:"local-2",n:"2",
   qEs:"Si tu compañero abre la MISMA URL en SU portátil, ¿ve tus notas?",
   qEn:"If your partner opens the SAME URL on THEIR laptop, do they see your notes?",
   opts:[{es:"Sí, se comparten",en:"Yes, shared"},{es:"No: cada navegador guarda las suyas",en:"No: each browser keeps its own"}],
   correct:1,
   expEs:"IndexedDB es <b>local</b>: solo en este navegador. Para compartir datos entre personas/dispositivos hace falta la <b>nube</b> → siguiente estación. 🔄 Cambiad de piloto.",
   expEn:"IndexedDB is <b>local</b>: only this browser. To share data across people/devices you need the <b>cloud</b> → next station. 🔄 Swap driver."}));
}

function sCloud(p){
  p.append(h("h2","title",L("Base de datos en la nube","Cloud database")));
  p.append(h("p","sub",L("Datos en un servidor, compartidos por todos — y por qué hace falta un backend.","Data on a server, shared by everyone — and why a backend is needed.")));
  p.append(intro(
   `<p>Para compartir datos entre personas, deben vivir <b>en la nube</b>. La app los pide por internet con <code>fetch</code> y llegan de forma <b>asíncrona</b> (el <code>await</code> de antes, ahora de verdad).</p>
    <p>Pulsa el botón: es una llamada <b>en vivo</b> a una API pública. 👇</p>`,
   `<p>To share data across people, it must live <b>in the cloud</b>. The app fetches it over the internet with <code>fetch</code>, arriving <b>asynchronously</b> (the earlier <code>await</code>, now for real).</p>
    <p>Press the button: it's a <b>live</b> call to a public API. 👇</p>`));
  const d=h("div","demo");const sc=h("div","screen","—");
  const go=h("button","p",L("☁️ Traer usuarios de la nube","☁️ Fetch users from the cloud"));
  go.onclick=async()=>{sc.className="screen";sc.textContent=L("⏳ Cargando…","⏳ Loading…");
    try{const r=await fetch("https://jsonplaceholder.typicode.com/users");if(!r.ok)throw new Error("HTTP "+r.status);
      const u=await r.json();sc.className="screen ok";
      sc.innerHTML="<b>"+u.length+L(" usuarios recibidos:</b><br>"," users received:</b><br>")+u.slice(0,5).map(x=>"• "+x.name+" — "+x.email).join("<br>")+"<br>…";
      award("cloud-1");}
    catch(e){sc.className="screen bad";sc.textContent="⛔ "+e.message;}};
  const r=h("div","row");r.append(go);d.append(r,sc);p.append(d);
  p.append(h("p",null,L("(Al traer los datos ganas tu ⭐ de esta estación.)","(Fetching the data earns your ⭐ for this station.)")));
  p.append(step(L("Y una BBDD de verdad: el patrón Supabase","A real DB: the Supabase pattern"),""));
  p.append(showCode(`import { createClient } from "@supabase/supabase-js";
const db = createClient("https://TU-PROYECTO.supabase.co", "ANON_KEY_PUBLICA");
const { data } = await db.from("notas").select("*");   // leer
await db.from("notas").insert({ texto: "hola nube" });  // escribir`));
  p.append(callout("warn",
   "Una web <b>no puede</b> guardar la contraseña secreta de la BBDD: cualquiera vería el código. Por eso la <code>anon key</code> es <b>pública</b> y limitada, y la seguridad real la pone el <b>servidor</b> (reglas por filas o un backend propio). <b>Eso es lo que vais a construir ahora.</b>",
   "A web page <b>can't</b> hold the DB's secret password: anyone could read the code. That's why the <code>anon key</code> is <b>public</b> and limited, and real security lives on the <b>server</b> (row rules or your own backend). <b>That's what you'll build next.</b>"));
  p.append(quiz({id:"cloud-2",n:"2",
   qEs:"¿Por qué NO se pone la contraseña secreta de la base de datos en el código del navegador?",
   qEn:"Why do we NOT put the database's secret password in the browser code?",
   opts:[{es:"Porque cualquiera vería el código y la robaría",en:"Because anyone could read the code and steal it"},{es:"Porque ocupa mucho",en:"Because it's too big"},{es:"Porque es más lento",en:"Because it's slower"}],
   correct:0,
   expEs:"Exacto. El código del navegador es público. Por eso la BBDD se protege en el <b>servidor</b> — el backend que empezáis ahora. 🔄 Último cambio de piloto.",
   expEn:"Exactly. Browser code is public. That's why the DB is protected on the <b>server</b> — the backend you start now. 🔄 Final driver swap."}));
}

// ---------------- render ----------------
function updateStars(){
  const done=ALL.filter(id=>solved.has(id)).length;
  $("#scount").textContent=done+"/"+ALL.length;$("#sbar").style.width=(done/ALL.length*100)+"%";
  [...document.querySelectorAll(".side .lv")].forEach((b,i)=>{const s=ST[i];
    const n=s.stars.filter(id=>solved.has(id)).length;b.classList.toggle("done",s.stars.length>0&&n===s.stars.length);
    const stEl=b.querySelector(".st");if(stEl)stEl.textContent=s.stars.length?n+"/"+s.stars.length:"";});
}
function buildSide(){const side=$("#side");side.innerHTML="";ST.forEach((s,i)=>{const b=h("button","lv"+(i===cur?" active":""));
  b.innerHTML='<span class="ic">'+s.ic+'</span><span class="txt">'+s.name[lang]+'</span><span class="st"></span>';
  b.onclick=()=>go(i);side.append(b);});updateStars();}
function go(i){cur=Math.max(0,Math.min(ST.length-1,i));localStorage.setItem("jsbackStation",cur);render();}
function render(){
  buildSide();const play=$("#play");play.innerHTML="";play.scrollTop=0;ST[cur].build(play);
  const nav=h("div","nav2");const pv=h("button","prev",t("prev")),nx=h("button","next",t("next"));
  pv.disabled=cur===0;nx.disabled=cur===ST.length-1;pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
  nav.append(pv,nx);play.append(nav);play.append(h("div","foot","De JS a Backend · Sistemas Web · Universidad San Jorge"));
  $("#pairLead").textContent=t("lead");$("#pLabel").textContent=t("pilot");$("#cLabel").textContent=t("copilot");
  $("#swapLabel").textContent=t("swap");$("#pairTip").textContent=t("pairtip");$("#brandsub").textContent=t("sub");
  $("#es").classList.toggle("on",lang==="es");$("#en").classList.toggle("on",lang==="en");document.documentElement.lang=lang;
}
function setLang(l){lang=l;localStorage.setItem("jsbackLang",l);render();}
$("#es").onclick=()=>setLang("es");$("#en").onclick=()=>setLang("en");
const root=document.documentElement;try{const th=localStorage.getItem("jsbackTheme");if(th)root.setAttribute("data-theme",th);}catch(e){}
$("#theme").onclick=()=>{const d=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);const n=d?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("jsbackTheme",n);}catch(e){}};
const pilot=$("#pilot"),copilot=$("#copilot");
try{pilot.value=localStorage.getItem("jsbackPilot")||"";copilot.value=localStorage.getItem("jsbackCopilot")||"";}catch(e){}
pilot.oninput=()=>localStorage.setItem("jsbackPilot",pilot.value);copilot.oninput=()=>localStorage.setItem("jsbackCopilot",copilot.value);
$("#swap").onclick=()=>{const a=pilot.value;pilot.value=copilot.value;copilot.value=a;pilot.oninput();copilot.oninput();toast(t("swapmsg"));};
try{cur=+localStorage.getItem("jsbackStation")||0;}catch(e){}
render();
</script>
